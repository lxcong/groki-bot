[project]
name = "stackchan-mcp"
version = "0.5.0"
description = "Voice and MCP gateway for the Groki Bot desktop robot (M5Stack CoreS3): Gemini Live voice with a Hi Grok wake word, plus a stdio MCP server for Claude and other clients."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kisaragi-mochi" },
    { name = "Groki Bot contributors" },
]
keywords = ["mcp", "stackchan", "groki-bot", "esp32", "xiaozhi", "gemini-live", "robotics", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
]
dependencies = [
    "websockets>=12",
    "pydantic>=2",
    "python-dotenv",
    "mcp>=1.0",
    "aiohttp>=3",
    "pyserial>=3.5",
    "edge-tts>=7",
]

[project.optional-dependencies]
# Phase 4 TTS — see Issue #70.
# Concrete engines (VOICEVOX, Irodori) consume these libraries:
#   * httpx     — VOICEVOX HTTP engine client
#   * opuslib   — Opus encoding for the device's audio decoder
# `tts-voicevox` is a no-op alias provided so users can declare intent
# explicitly; the VOICEVOX engine itself is an external HTTP process and
# adds no Python dependencies of its own.
tts = [
    "httpx>=0.27",
    "opuslib>=3",
]
tts-voicevox = [
    "stackchan-mcp[tts]",
]
gemini-live = [
    "google-genai>=2.0.1",
    "sounddevice>=0.5.5",
]
# Music on the device's speaker (stackchan_mcp/music_player.py): PyAV decodes
# local files and internet streams.
music = [
    "av>=14",
    "yt-dlp>=2025.1",
]
wakeword = [
    "numpy>=1.26",
    "sherpa-onnx==1.13.2",
    # Native runtime (libonnxruntime) ships in the core wheel; without it the
    # import fails with "Library not loaded: libonnxruntime".
    "sherpa-onnx-core==1.13.2",
]

[project.urls]
Homepage = "https://github.com/JosssphZhou/groki-bot"
Repository = "https://github.com/JosssphZhou/groki-bot"
Issues = "https://github.com/JosssphZhou/groki-bot/issues"
Documentation = "https://github.com/JosssphZhou/groki-bot/blob/main/docs/architecture.md"
Upstream = "https://github.com/kisaragi-mochi/stackchan-mcp"

[project.scripts]
stackchan-mcp = "stackchan_mcp.cli:main"
stackchan-gbot-proxy = "stackchan_mcp.gbot_http_proxy:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
